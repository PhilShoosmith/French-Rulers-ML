
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rulers of France Timeline</title>
    <link rel="preconnect" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <meta name="description" content="Test your knowledge of French leaders by placing them on the correct spot on the timeline. From medieval kings to modern presidents, score points for accuracy and see how well you know your French history!" />
    <script>
      // Mock Vite HMR WebSocket in cloud container environment to prevent connection failures and rejections
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                            protocols === 'vite-hmr' ||
                            (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('/@vite') !== -1));
            if (isViteHmr) {
              var listeners = {};
              return {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: String(url),
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (
            (event.reason.message && event.reason.message.indexOf('WebSocket') !== -1) ||
            (event.reason.stack && event.reason.stack.indexOf('@vite/client') !== -1)
          )) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if ((event.message && event.message.indexOf('WebSocket') !== -1) ||
              (event.filename && event.filename.indexOf('@vite/client') !== -1)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);
      })();
    </script>
    <link rel="stylesheet" href="/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
<style>
  /* General Animations */
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
  
  @keyframes scale-in { 
    from { transform: scale(0.95); opacity: 0; } 
    to { transform: scale(1); opacity: 1; } 
  }
  .animate-scale-in { animation: scale-in 0.3s ease-out forwards; }

  /* Component-specific Animations */
  @keyframes pop-in-marker {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
  .animate-pop-in-marker { animation: pop-in-marker 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

  @keyframes rise-up {
    0% { transform: translateY(20px); opacity: 0; }
    50% { opacity: 0.8; }
    100% { transform: translateY(-20px); opacity: 0; }
  }
  .animate-rise-up { animation: rise-up 2s ease-in-out infinite; }
  
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); } 
  }

  @keyframes fall {
    to {
      transform: translateY(calc(100vh + 20px)) rotate(720deg);
      opacity: 0;
    }
  }

  /* Animation Utilities */
  .animation-delay-200 { animation-delay: 0.2s; }
  .animation-delay-400 { animation-delay: 0.4s; }
  .animation-delay-600 { animation-delay: 0.6s; }
  .animation-delay-800 { animation-delay: 0.8s; }
  .animation-delay-1000 { animation-delay: 1.0s; }
</style>
</head>
  <body class="bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
